name: Close linked issues on PR merge

on:
  pull_request_target:
    types:
      - closed

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in PR description and commits
        uses: actions/github-script@v7
        with:
          script: |
            const closingKeywordPattern = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b/i;
            const hashReferencePattern = /(?:([\w.-]+)\/([\w.-]+))?#(\d+)/g;
            const urlReferencePattern = /https:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/issues\/(\d+)/g;

            const defaultOwner = context.repo.owner;
            const defaultRepo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;

            function addReference(references, owner, repo, number) {
              const issueNumber = Number.parseInt(number, 10);

              if (Number.isNaN(issueNumber)) {
                return;
              }

              references.set(`${owner}/${repo}#${issueNumber}`, {
                owner,
                repo,
                number: issueNumber
              });
            }

            function extractReferencesFromLine(line, references) {
              if (!closingKeywordPattern.test(line)) {
                return;
              }

              for (const match of line.matchAll(hashReferencePattern)) {
                addReference(
                  references,
                  match[1] ?? defaultOwner,
                  match[2] ?? defaultRepo,
                  match[3]
                );
              }

              for (const match of line.matchAll(urlReferencePattern)) {
                addReference(references, match[1], match[2], match[3]);
              }
            }

            function extractReferencesFromText(text, references) {
              if (!text) {
                return;
              }

              for (const line of text.split(/\r?\n/)) {
                extractReferencesFromLine(line, references);
              }
            }

            const references = new Map();
            const pullRequest = context.payload.pull_request;

            extractReferencesFromText(pullRequest.body, references);

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: defaultOwner,
              repo: defaultRepo,
              pull_number: pullNumber,
              per_page: 100
            });

            for (const commit of commits) {
              extractReferencesFromText(commit.commit.message, references);
            }

            if (references.size === 0) {
              core.info('No issues referenced with closing keywords.');
              return;
            }

            for (const reference of references.values()) {
              if (reference.owner === defaultOwner
                && reference.repo === defaultRepo
                && reference.number === pullNumber) {
                core.info(`Skipping pull request #${pullNumber} self-reference.`);
                continue;
              }

              let issue;

              try {
                const response = await github.rest.issues.get({
                  owner: reference.owner,
                  repo: reference.repo,
                  issue_number: reference.number
                });

                issue = response.data;
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Skipping missing issue ${reference.owner}/${reference.repo}#${reference.number}.`);
                  continue;
                }

                throw error;
              }

              if (issue.pull_request) {
                core.info(`Skipping pull request ${reference.owner}/${reference.repo}#${reference.number}.`);
                continue;
              }

              if (issue.state === 'closed') {
                core.info(`Issue ${reference.owner}/${reference.repo}#${reference.number} is already closed.`);
                continue;
              }

              await github.rest.issues.update({
                owner: reference.owner,
                repo: reference.repo,
                issue_number: reference.number,
                state: 'closed',
                state_reason: 'completed'
              });

              await github.rest.issues.createComment({
                owner: reference.owner,
                repo: reference.repo,
                issue_number: reference.number,
                body: `Closed by ${defaultOwner}/${defaultRepo}#${pullNumber}.`
              });

              core.info(`Closed issue ${reference.owner}/${reference.repo}#${reference.number}.`);
            }
